[libdefaults]
    default_realm = LAB.LAN
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    LAB.LAN = {
        kdc = 172.25.0.20:88
        admin_server = 172.25.0.20:749
        default_domain = lab.lan
        pkinit_anchors = FILE:/var/lib/krb5/ca_root.crt
        pkinit_kdc_hostname = kdc.lab.lan
    }

[domain_realm]
    .lab.lan = LAB.LAN
    lab.lan = LAB.LAN
