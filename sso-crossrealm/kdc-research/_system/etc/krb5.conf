[libdefaults]
    default_realm = RESEARCH.LAB
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true

[realms]
    STUDENT.LAB = {
        kdc = 172.25.0.10:88
        admin_server = 172.25.0.10:749
        default_domain = student.lab
    }
    RESEARCH.LAB = {
        kdc = 172.25.0.20:88
        admin_server = 172.25.0.20:749
        default_domain = research.lab
    }

[domain_realm]
    .student.lab = STUDENT.LAB
    student.lab = STUDENT.LAB
    .research.lab = RESEARCH.LAB
    research.lab = RESEARCH.LAB

[capaths]
    STUDENT.LAB = {
        RESEARCH.LAB = .
    }
    RESEARCH.LAB = {
        STUDENT.LAB = .
    }
