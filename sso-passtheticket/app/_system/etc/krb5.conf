[libdefaults]
    default_realm = LAB.LAN
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    LAB.LAN = {
        kdc = 172.25.0.10:88
        admin_server = 172.25.0.10:749
        default_domain = lab.lan
    }

[domain_realm]
    .lab.lan = LAB.LAN
    lab.lan = LAB.LAN
